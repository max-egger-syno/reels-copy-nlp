<script>
(() => {
  const DATA = JSON.parse(document.getElementById("payload").textContent);
  const SECTOR = { ai: "IA", hair_visagism: "Cabelo e visagismo", sales: "Vendas", trading: "Trading", sports: "Esporte" };
  const S = DATA.card_stats, N = S.n_creators;
  const CARDS = [
    { t: "Primeira linha curta",
      d: "A primeira linha da legenda é o que aparece antes do \"mais\". Nos Reels que viralizaram, ela costumava ter até 60 caracteres.",
      ev: `Mais comum nos virais em ${S.short_first_line.up} de ${N} criadores (o contrário em ${S.short_first_line.down}).`,
      ex: "\"Essa notícia me deixou decepcionado.\"" },
    { t: "Números e valores na abertura pesam contra",
      d: "Listas numeradas (\"3 mudanças\", \"10 anos\") e valores em dinheiro na primeira linha apareceram mais nos Reels que não viralizaram.",
      ev: `Números na 1ª linha: mais comuns nos que não viralizaram em ${S.number_first_line.down} de ${N} criadores. Dinheiro: em ${S.money_number.down} de ${N}, nunca o contrário.`,
      ex: "Fraco: \"Três coisas que estão te envelhecendo 10 anos.\"" },
    { t: "Menos \"você\" genérico",
      d: "Falar com \"você\" o tempo todo não ajudou. Opinião, notícia e reação em primeira pessoa funcionaram melhor dentro do mesmo perfil.",
      ev: `\"Você\" mais comum nos que não viralizaram em ${S.second_person.down} de ${N} criadores, nunca o contrário.`,
      ex: "\"Precisava falar sobre isso\"" },
    { t: "Pedir para seguir não atrapalha",
      d: "Um pedido direto para seguir apareceu um pouco mais nos virais. É um sinal fraco: ajuda pouco, mas não custa.",
      ev: `Mais comum nos virais em ${S.cta_follow.up} de ${N} criadores, nunca o contrário.`,
      ex: "\"Já me segue pra vender mais com menos esforço.\"" },
  ];

  // Counterbalanced: half the people see block 1 before the cards, half see block 2 first.
  // crypto first: the host can make Math.random repeat, and every early participant got the same order.
  const coin = (() => { try { return crypto.getRandomValues(new Uint8Array(1))[0] & 1; }
    catch (e) { return (Date.now() + performance.now() * 1000) % 2 < 1 ? 0 : 1; } })();
  const order = coin ? [2, 1] : [1, 2];
  const blocks = order.map((b) => DATA.pairs.filter((p) => p.block === b));
  const state = { step: "intro", name: "", creator: "", answers: [{}, {}], helped: 0, comment: "", t0: Date.now() };
  const app = document.getElementById("app");
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v; else if (k.startsWith("on")) n.addEventListener(k.slice(2), v); else n.setAttribute(k, v);
    }
    kids.flat().forEach((k) => n.append(k instanceof Node ? k : document.createTextNode(String(k))));
    return n;
  };
  const total = blocks[0].length + blocks[1].length;
  const answered = () => Object.keys(state.answers[0]).length + Object.keys(state.answers[1]).length;

  function render() {
    app.replaceChildren();
    window.scrollTo(0, 0);
    ({ intro, b0: () => pairs(0), cards, b1: () => pairs(1), final, done })[state.step]();
  }

  function intro() {
    let creator = "";
    const name = el("input", { type: "text", id: "name", placeholder: "Pode deixar em branco", maxlength: "40" });
    const seg = el("div", { class: "seg", role: "group", "aria-label": "Você cria conteúdo?" });
    const go = el("button", { class: "primary", disabled: "", onclick: () => {
      state.name = name.value.trim().replace(/\|/g, "/"); state.creator = creator; state.step = "b0"; render(); } }, "Começar");
    ["Sim", "Não"].forEach((v) => seg.append(el("button", { type: "button", "aria-pressed": "false", onclick: (e) => {
      creator = v; seg.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b === e.currentTarget)));
      go.disabled = false; } }, v)));
    app.append(
      el("p", { class: "eyebrow" }, "Pesquisa Insper · Processamento de Linguagem Natural"),
      el("h1", {}, "Qual Reel viralizou?"),
      el("p", {}, `Você vai ver ${total} pares de Reels do mesmo criador, postados com até 14 dias de diferença. Em cada par, um teve pelo menos o dobro de visualizações do outro. Pelo texto, escolha qual você acha que foi o mais visto.`),
      el("p", { class: "muted" }, "No meio, você lê 4 dicas curtas de copy. Leva uns 6 minutos. Só registramos o seu palpite em cada par."),
      el("div", {}, el("label", { for: "name" }, "Seu nome ou apelido (opcional)"), name),
      el("div", {}, el("label", {}, "Você cria conteúdo para redes sociais?"), seg),
      go);
  }

  function pairs(bi) {
    const list = blocks[bi];
    const i = Object.keys(state.answers[bi]).length;
    if (i >= list.length) { state.step = bi === 0 ? "cards" : "final"; return render(); }
    const p = list[i];
    const pick = (side) => { state.answers[bi][p.id] = side; render(); };
    const cap = (side, txt, hook) => el("div", { class: "cap" },
      el("div", { class: "tag" }, `Reel ${side}`),
      el("div", { class: "txt" }, txt),
      hook ? el("div", { class: "hook" }, el("em", {}, "Primeiras palavras faladas: "), hook) : "",
      el("button", { class: "primary pick", onclick: () => pick(side) }, `Reel ${side} teve mais views`));
    app.append(
      el("div", { class: "progress", role: "progressbar", "aria-valuemin": "0", "aria-valuemax": String(total), "aria-valuenow": String(answered()) },
        Object.assign(el("i"), { style: `width:${(answered() / total) * 100}%` })),
      el("div", { class: "who" }, el("span", {}, el("b", {}, `@${p.creator}`), ` · ${SECTOR[p.sector] || p.sector}`),
        el("span", { class: "muted" }, `Parte ${bi + 1} · ${i + 1} de ${list.length}`)),
      el("p", { class: "muted" }, "Legenda de cada Reel (sem as hashtags):"),
      cap("A", p.a, p.ah), cap("B", p.b, p.bh));
  }

  function cards() {
    app.append(
      el("p", { class: "eyebrow" }, "Intervalo · leia antes da parte 2"),
      el("h2", {}, "4 dicas tiradas de 700 Reels"),
      el("p", { class: "muted" }, `Comparamos cada criador com ele mesmo: os Reels que mais viralizaram contra os que menos viralizaram, em ${N} criadores de 5 setores. Os pares que você está vendo não entraram nesta conta.`),
      el("div", { class: "cards" }, CARDS.map((c) => el("div", { class: "card" },
        el("h3", {}, c.t), el("p", {}, c.d), el("p", { class: "ex" }, c.ex), el("p", { class: "ev" }, c.ev)))),
      el("button", { class: "primary", onclick: () => { state.step = "b1"; render(); } }, "Li as dicas, seguir para a parte 2"));
  }

  function final() {
    const seg = el("div", { class: "seg", role: "group", "aria-label": "As dicas ajudaram?" });
    const comment = el("textarea", { id: "comment", rows: "3", maxlength: "300", placeholder: "Opcional" });
    const go = el("button", { class: "primary", disabled: "", onclick: () => {
      state.comment = comment.value.trim().replace(/\|/g, "/").replace(/\s+/g, " "); state.step = "done"; render(); } }, "Ver meu resultado");
    for (let v = 1; v <= 5; v++) seg.append(el("button", { type: "button", "aria-pressed": "false", onclick: (e) => {
      state.helped = v; seg.querySelectorAll("button").forEach((b) => b.setAttribute("aria-pressed", String(b === e.currentTarget)));
      go.disabled = false; } }, String(v)));
    app.append(
      el("h2", {}, "Última pergunta"),
      el("div", {}, el("label", {}, "As dicas ajudaram você a escolher na parte 2?"),
        el("p", { class: "muted" }, "1 = nada, 5 = muito"), seg),
      el("div", {}, el("label", { for: "comment" }, "Algum comentário sobre as dicas?"), comment),
      go);
  }

  function done() {
    const score = (bi) => blocks[bi].filter((p) => state.answers[bi][p.id] === p.ans).length;
    const s0 = score(0), s1 = score(1);
    const enc = (bi) => blocks[bi].map((p) => `${p.id}${state.answers[bi][p.id]}`).join("");
    const mins = Math.round((Date.now() - state.t0) / 6000) / 10;
    const code = ["TESTE-REELS v1", `nome:${state.name || "-"}`, `cria:${state.creator}`, `ordem:${order.join("")}`,
      `antes:${enc(0)}`, `depois:${enc(1)}`, `ajudou:${state.helped}`, `min:${mins}`, `obs:${state.comment || "-"}`].join(" | ");
    const msg = `Fiz o teste dos Reels! Acertei ${s0 + s1} de ${total}.\n${code}`;
    const copyBtn = el("button", { class: "ghost", onclick: async () => {
      try { await navigator.clipboard.writeText(msg); copyBtn.textContent = "Copiado"; }
      catch (e) { const r = document.createRange(); r.selectNodeContents(codeBox); const s = getSelection(); s.removeAllRanges(); s.addRange(r); copyBtn.textContent = "Selecionado: copie com o menu"; }
    } }, "Copiar resultado");
    const codeBox = el("div", { class: "code" }, msg);
    app.append(
      el("p", { class: "eyebrow" }, "Resultado"),
      el("div", { class: "score" }, `${s0 + s1}/${total}`),
      el("p", {}, `Antes das dicas: ${s0} de ${blocks[0].length}. Depois das dicas: ${s1} de ${blocks[1].length}.`),
      el("p", { class: "muted" }, "Para referência: num estudo com tweets, pessoas acertaram 61% de pares parecidos."),
      el("h2", {}, "Falta só um passo"),
      el("p", {}, "Mande o resultado abaixo para quem te enviou este link. É assim que a sua resposta entra na pesquisa."),
      el("div", { class: "row" },
        el("a", { class: "btn", href: `https://wa.me/?text=${encodeURIComponent(msg)}`, target: "_blank", rel: "noopener" }, "Enviar no WhatsApp"),
        copyBtn),
      codeBox);
  }

  render();
})();
</script>
